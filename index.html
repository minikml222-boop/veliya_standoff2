<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Вход в систему</title>
    <style>
        body {
            background-color: #0f0f1a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            background: #161625;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            border: 2px solid #2e2e4a;
            width: 90%;
            max-width: 350px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #eb4b4b;
            margin-bottom: 20px;
            object-fit: cover;
        }
        h2 { margin: 10px 0; font-size: 1.5rem; }
        p { color: #888; font-size: 0.9rem; margin-bottom: 25px; }
        .btn-enter {
            background: #eb4b4b;
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }
        .btn-enter:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="login-card">
    <img src="1000045055.jpg" alt="Веляш" class="avatar">
    <h2>Привет, Веляш!</h2>
    <p>Готов выбить свою первую аркану?</p>
    <a href="game.html" class="btn-enter">ВОЙТИ В ИГРУ</a>
</div>

</body>
</html
